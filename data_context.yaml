Database:
  name: test_database
  type: postgresql
  description: >
    This is a sample database configuration file for testing purposes. It contains the necessary settings to connect to a test database and manage its tables.


tables:
  sales:
    description: >
      This is a sample database configuration file for testing purposes. It contains the necessary settings to connect to a test database and manage its tables.
    columns:
      - name: id
        type: integer
        primary_key: true
        auto_increment: true
      - name: name
        type: varchar(255)
        nullable: false
      - name: created_at
        type: timestamp
        default: CURRENT_TIMESTAMP


  products:
    description: >
      This table stores information about products available in the test database. It includes product details such as name, price, and stock quantity.
    
    columns:
      - name: id
        type: integer
        primary_key: true
        auto_increment: true
      - name: name
        type: varchar(255)
        nullable: false
      - name: price
        type: decimal(10, 2)
        nullable: false
      - name: stock_quantity
        type: integer
        nullable: false 


  relationships:
    description: >
      This section defines the relationships between the tables in the test database. It specifies how the tables are linked together through foreign keys.
    
    foreign_keys:
      - name: fk_sales_product
        source_table: sales
        source_column: product_id
        target_table: products
        target_column: id

